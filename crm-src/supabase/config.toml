# Partial production configuration. CLI 2.122.0 preserves undeclared properties.
# Run config diff against the explicit project before pushing; never push local init defaults.
project_id = "kingson-engineering-crm"

[auth]
site_url = "https://www.kingsonengineering.co.zw/crm"
additional_redirect_urls = ["https://www.kingsonengineering.co.zw/crm?reset=1", "https://www.kingsonengineering.co.zw/crm/?reset=1", "https://www.kingsonengineering.co.zw/crm/index.html?reset=1"]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 14
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.rate_limit]
sign_in_sign_ups = 10
token_verifications = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = false
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"

[functions.crm-upload]
verify_jwt = true
