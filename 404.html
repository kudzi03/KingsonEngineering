<style>
  /* The site's own hero, reused: same tokens, same scrim, same buttons. The
     previous version of this file styled itself against tokens that no longer
     exist, so it rendered with no colour at all. Nothing is redefined here
     that styles/site.css already defines. */
  .hero { min-height: 100svh; min-height: 100vh; }
  /* The scrim is bottom-weighted, so the top of the frame is bright sky and the
     reversed mark in the logo disappears into a cloud. The plaque fixes that
     wherever the photograph happens to be light. */
  .nf-mark {
    position: absolute; z-index: 2; top: clamp(20px, 4vw, 36px); left: var(--margin);
    display: inline-flex; padding: 12px 16px; border-radius: var(--r);
    background: rgba(15, 18, 17, .82); backdrop-filter: blur(6px);
  }
  .nf-mark img { width: auto; height: 46px; }
  .nf-code { font-size: var(--t-small); font-weight: 500; color: var(--fg-on-dark-muted);
             letter-spacing: .14em; text-transform: uppercase; margin-bottom: 16px; }
</style>

<section class="hero">
